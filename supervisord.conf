[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

# 板块映射初始化（一次性任务，启动时执行）
[program:init_mapping]
command=python scripts/collect_sector_mapping.py
directory=/app
stdout_logfile=/app/logs/init_mapping.log
stderr_logfile=/app/logs/init_mapping.log
autostart=true
autorestart=false
startsecs=0
priority=100

# MCP HTTP 服务器（主服务）
[program:mcp_server]
command=python server_http.py
directory=/app
stdout_logfile=/app/logs/mcp_server.log
stderr_logfile=/app/logs/mcp_server.log
autostart=true
autorestart=true
priority=200

# 实时行情数据采集器
[program:realtime_collector]
command=python scripts/realtime_collector.py
directory=/app
stdout_logfile=/app/logs/realtime_collector.log
stderr_logfile=/app/logs/realtime_collector.log
autostart=true
autorestart=true
priority=300

# 板块强度数据采集器
[program:sector_collector]
command=python scripts/sector_strength_collector.py
directory=/app
stdout_logfile=/app/logs/sector_collector.log
stderr_logfile=/app/logs/sector_collector.log
autostart=true
autorestart=true
priority=300
